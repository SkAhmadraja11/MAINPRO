version: '3.8'

services:
  backend:
    image: skahmadraja11/music-streaming-backend:latest
    container_name: music-backend
    depends_on:
      db:
        condition: service_healthy
        required: true
    environment:
      JAVA_OPTS: -Xmx512m -Xms256m
      SERVER_PORT: "2057"
      SPRING_DATASOURCE_PASSWORD: music_password
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/musicdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: music_user
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.MySQL8Dialect
      SPRING_JPA_SHOW_SQL: "false"
    ports:
      - "2057:2057"
    restart: unless-stopped

  db:
    container_name: music-db
    environment:
      MYSQL_DATABASE: musicdb
      MYSQL_PASSWORD: music_password
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: music_user
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - 127.0.0.1
        - -uroot
        - -proot
      timeout: 5s
      interval: 10s
      retries: 5
      start_period: 30s
    image: mysql:8.0
    restart: unless-stopped
    volumes:
      - mysql_data:/var/lib/mysql

  frontend:
    image: skahmadraja11/music-streaming-frontend:latest
    container_name: music-frontend
    depends_on:
      backend:
        condition: service_started
        required: true
    environment:
      REACT_APP_API_URL: http://backend:2057
    ports:
      - "3000:80"
    restart: unless-stopped

networks:
  default:
    name: mainpro_default

volumes:
  mysql_data:
    name: mainpro_mysql_data