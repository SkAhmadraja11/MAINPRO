name: Tests and Code Quality

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Maven tests
        run: |
          cd MUSIC-SPRINGBOOT
          mvn clean test -B

      - name: Run Maven build
        run: |
          cd MUSIC-SPRINGBOOT
          mvn clean install -B -DskipTests

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'MUSIC-REACT/package-lock.json'

      - name: Install dependencies
        run: |
          cd MUSIC-REACT
          npm ci

      - name: Run linter
        run: |
          cd MUSIC-REACT
          npm run lint || true

      - name: Build frontend
        run: |
          cd MUSIC-REACT
          npm run build
